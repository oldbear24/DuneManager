name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add MinGW to PATH (pre-installed on windows-latest)
        run: echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download dependencies
        run: go mod download

      - name: Build dune-manager.exe
        run: |
          go build -ldflags "-H windowsgui -X github.com/oldbear24/DuneManager/internal/build.Version=${{ github.ref_name }}" `
            -o dune-manager.exe .

      - name: Build dune-manager-svc.exe
        run: |
          go build -ldflags "-X github.com/oldbear24/DuneManager/internal/build.Version=${{ github.ref_name }}" `
            -o dune-manager-svc.exe ./cmd/service

      - name: Build dune-manager-updater.exe
        run: |
          go build -o dune-manager-updater.exe ./cmd/updater

      - name: Create release zip
        run: |
          Compress-Archive `
            -Path dune-manager.exe, dune-manager-svc.exe, dune-manager-updater.exe `
            -DestinationPath dune-manager-${{ github.ref_name }}-windows.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dune-manager.exe
            dune-manager-svc.exe
            dune-manager-updater.exe
            dune-manager-${{ github.ref_name }}-windows.zip
